apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-support-frontend
  namespace: ai-support
  labels:
    app: ai-support-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-support-frontend
  template:
    metadata:
      labels:
        app: ai-support-frontend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      containers:
        - name: frontend
          image: ghcr.io/your-org/ai-support-platform:latest
          imagePullPolicy: Always
          command:
            - streamlit
            - run
            - frontend/streamlit_app.py
            - --server.address
            - 0.0.0.0
            - --server.port
            - "8501"
            - --server.headless
            - "true"
          env:
            - name: API_BASE_URL
              value: http://ai-support-api-svc.ai-support.svc.cluster.local
          ports:
            - containerPort: 8501
              name: http
          resources:
            requests:
              cpu: "50m"
              memory: "256Mi"
            limits:
              cpu: "300m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: ai-support-frontend-nodeport
  namespace: ai-support
spec:
  type: NodePort
  selector:
    app: ai-support-frontend
  ports:
    - name: http
      port: 80
      targetPort: 8501
      nodePort: 30085
